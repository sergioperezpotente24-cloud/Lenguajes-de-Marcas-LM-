
<!DOCTYPE html>

<head>

                </div>

             <!-- Cuarta fila de la columna derecha -->

                    <img src="img/logo.jpg">
                </div>
                <div class="col-6 col-lg-2 bg-light border border-dark">
                    <p>hola</p>
                </div>
                <div class="col-6 col-lg-4 bg-light border border-dark">
